{% extends 'base.html' %}

{% block title %}Internal Server Error{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
    <h1 class="display-1">500</h1>
    <h2>Oops! Something Went Wrong</h2>
    <p class="lead">We encountered an internal server error. Please try again later or contact support if the problem persists.</p>
    <p class="text-muted"><small>Our team has been notified.</small></p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Go Back Home</a>
</div>
{% endblock %}
