name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Lint and Format with Ruff
      run: |
        ruff format --check .
        ruff check .
        
    - name: Test with pytest and enforce 99% coverage
      run: |
        PYTHONPATH=. pytest --cov=server --cov-fail-under=99 --cov-report=term-missing
